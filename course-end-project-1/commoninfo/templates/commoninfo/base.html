<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AB Hospital &mdash; {% block title %}Patient Records{% endblock %}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #eef3f8; }
        .app-card {
            max-width: 560px;
            margin: 48px auto;
            border: none;
            box-shadow: 0 8px 30px rgba(13, 71, 161, 0.12);
        }
        .app-header {
            background: #0d47a1;
            color: #fff;
            border-radius: .5rem .5rem 0 0;
            padding: 24px;
            text-align: center;
        }
        .app-header h1 { margin: 0; font-size: 1.6rem; }
        .app-header p { margin: 4px 0 0; opacity: .85; }
        .app-body { padding: 28px; }
    </style>
</head>
<body>
    <div class="card app-card">
        <div class="app-header">
            <h1>AB Hospital</h1>
            <p>Patient Registration System</p>
        </div>
        <div class="card-body app-body">
            {% block content %}{% endblock %}
        </div>
    </div>
</body>
</html>
