{% extends "commoninfo/base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
    <h2 class="h5 mb-4">Patient Registration</h2>

    {% if success %}
        <div class="alert alert-success" role="alert">{{ success }}</div>
    {% endif %}
    {% if error %}
        <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% url 'add' %}">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" type="text" id="name" name="name" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="uniqueID">Unique ID</label>
            <input class="form-control" type="text" id="uniqueID" name="uniqueID" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="dob">Date of Birth</label>
            <input class="form-control" type="date" id="dob" name="dob" required>
        </div>
        <div class="d-flex justify-content-between align-items-center">
            <a href="{% url 'index' %}">&larr; Back</a>
            <button class="btn btn-primary" type="submit">SUBMIT</button>
        </div>
    </form>
{% endblock %}
